services:
  db:
    image: mysql:8.4
    container_name: laundry-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: laundry_management_db
      MYSQL_USER: ${MYSQL_USER:-laundry}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-laundry123}
      TZ: ${TZ:-Asia/Colombo}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/laundry_management.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/02-saved-reports.sql:/docker-entrypoint-initdb.d/02-saved-reports.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - laundry-network

  app:
    container_name: laundry-app
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      LAUNDRY_DB_URL: jdbc:mysql://db:3306/laundry_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo&connectTimeout=10000&socketTimeout=30000
      LAUNDRY_DB_USERNAME: ${MYSQL_USER:-laundry}
      LAUNDRY_DB_PASSWORD: ${MYSQL_PASSWORD:-laundry123}
      TZ: ${TZ:-Asia/Colombo}
    networks:
      - laundry-network
    stop_grace_period: 20s

volumes:
  db_data:

networks:
  laundry-network:
    name: aquaclean-laundry-network
    driver: bridge
